# ==============================================================================
# FILE: conf/config.yaml
# DESCRIPTION: Main configuration for Sys-Inspector.
#              This file controls Execution Modes, Network Settings, Storage,
#              and Collection Intervals.
#
# USAGE:
#   - AGENT:  set 'mode: daemon' and point daemon.server_ip at the server
#   - SERVER: set 'mode: server' and configure 'network.bind_port'
#
#   For a single machine, install BOTH: the agent collects and the server
#   receives, on the same host.
#
#   [2026-08-19, C-134] The snapshot, live and local-live modes were REMOVED.
#   They were three parallel implementations of the same collection routine and
#   they silently drifted apart.
#
# AUTHOR: Mario Luz (Sys-Inspector Project)
# VERSION: 0.80.00 (Updated from 0.70.01)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GENERAL SETTINGS
# ------------------------------------------------------------------------------
general:
  # Execution Mode. Options: [daemon, server]
  #   daemon: the agent. Collects, encrypts, stores and forwards.
  #   server: receives from the agents and renders the report.
  mode: "daemon"

  # Logging Verbosity. Options: [DEBUG, INFO, WARN, ERROR]
  log_level: "INFO"

# ------------------------------------------------------------------------------
# 2. NETWORK SETTINGS (For Live, Daemon, and Server modes)
# ------------------------------------------------------------------------------
network:
  # IP Address to bind the Web Server/API.
  bind_address: "0.0.0.0"

  # Port for the Web Interface (Live/Server mode)
  bind_port: 8080

  # [v0.90.16 NEW] Dashboard authentication (HTTP Basic Auth).
  # Works over both HTTP and HTTPS. Disabled by default to preserve the current
  # open behavior; set enabled: true and provide a password_hash to require login.
  # Generate the hash with: python3 tools/gen_password.py
  auth:
    enabled: false
    username: "admin"
    password_hash: ""

  # [v0.90.16 NEW] Serve the dashboard over HTTPS. Disabled by default (HTTP).
  # When enabled, if the cert/key below are missing, a self-signed pair is
  # generated automatically on first start (browsers will warn about the
  # unknown issuer, which is expected). Basic Auth works over HTTP and HTTPS.
  tls_enabled: false
  ssl_cert: "/etc/sys-inspector/server_cert.pem"
  ssl_key: "/etc/sys-inspector/server_key.pem"

  # [LEGACY v0.60] Used by old Daemon to push data directly (Deprecated in v0.80)
  # target_url: "http://127.0.0.1:8080"

# ------------------------------------------------------------------------------
# 3. COLLECTION SETTINGS
# ------------------------------------------------------------------------------
collection:
  # [LEGACY v0.60] Global interval fallback
  interval: 30

# ------------------------------------------------------------------------------
# 4. STORAGE SETTINGS (Local Persistence)
# ------------------------------------------------------------------------------
storage:
  type: "sqlite"

  # Path to the encrypted database
  # sqlite_path: "data/sys_inspector.db"
  sqlite_path: "/var/lib/sys-inspector/sys_inspector.db"

  # [v0.70] Retention Policy: Max number of snapshots to keep per Agent.
  # When limit is reached, oldest snapshots are deleted (Circular Buffer).
  max_snapshots: 100

  # [LEGACY v0.61] Byte-based limit (Kept for compatibility with old controllers)
  # Not actively used by DatabaseManager v0.70+ (relies on max_snapshots)
  # db_size_limit_bytes: 20971520

# ------------------------------------------------------------------------------
# 5. FEATURE FLAGS (Enable/Disable specific probes)
# ------------------------------------------------------------------------------
features:
  # Detect Docker/Podman/K8s containers via cgroups
  container_awareness: true

  # Detect Crypto-mining signatures and GPU usage (Needs NVML libs present)
  gpu_monitoring: true

  # Detect Security Inspectors (Fanotify/EDR presence)
  security_inspection: true

# ------------------------------------------------------------------------------
# 5-B. FORENSICS: DIRECTED ACQUISITION (C-043, decision D-032)
# ------------------------------------------------------------------------------
# When a finding is raised, preserve enough of the artifact to IDENTIFY it and
# DIRECT the next analysis -- never the bulk of it. Mass collection (memory
# images, traffic dumps) is bench work and is deliberately out of scope: what is
# kept here is the full-object hash, the metadata, and a small excerpt.
#
# DISABLED BY DEFAULT ON PURPOSE. Turning this on makes the agent WRITE to the
# host it measures. That must be an operator decision, never a side effect of
# upgrading the tool. While disabled, every finding still says so explicitly,
# so "not collected" is never read as "nothing was there".
forensics:
  acquisition:
    enabled: false

    # Excerpt kept per artifact, in bytes. 4 KB covers an ELF header, the start
    # of a shellcode and the first strings, which is what answers "which pattern
    # is this". Raising it does not buy more identification, only more bytes.
    excerpt_bytes: 4096

    # Above this size the hash covers only the excerpt instead of the whole
    # object, and the report states that. Hashing is cheap in space but not in
    # READS: scanning a huge object on the measured host costs I/O nobody asked
    # for.
    hash_max_bytes: 16777216

    # Full copies are made only for artifacts small enough to fit here. This is
    # the CUSTODY_FULL case of D-032: the analyst gets the sample itself and does
    # not have to come back to a host that may no longer exist.
    copy_max_bytes: 262144

    # Budget for the WHOLE capture. Without it, a host with 200 findings would
    # acquire 200 times the per-artifact cap and the per-artifact cap would mean
    # nothing.
    capture_max_bytes: 4194304

    # Where preserved copies land. Created with mode 0700, files with 0400.
    dir: "/var/lib/sys-inspector/acquired"

# ------------------------------------------------------------------------------
# 6. SECURITY (Zero-Knowledge & Hybrid Encryption)
# ------------------------------------------------------------------------------
security:
  # [v0.70 NEW] Path to the Analyst's Public Key.
  # REQUIRED for encrypting data before saving to DB (Agent/Snapshot).
  # public_key_path: "conf/public_key.pem"
  public_key_path: "/etc/sys-inspector/public_key.pem"

  # [v0.70 NEW] Path to the Analyst's Private Key.
  # REQUIRED ONLY for generating HTML reports or decrypting data.
  # WARNING: DO NOT deploy this file to Agents!
  # private_key_path: "conf/private_key.pem"
  private_key_path: "/etc/sys-inspector/private_key.pem"

  # [v0.70 NEW] Backend for symmetric encryption (fernet/aes-gcm)
  crypto_backend: "fernet"

# ------------------------------------------------------------------------------
# 7. MODE SPECIFIC SETTINGS
# ------------------------------------------------------------------------------

# Settings for 'snapshot' mode
snapshot:
  duration: 30 # Seconds to capture before exiting
  # output_dir: "report"
  output_dir: "/var/log/sys-inspector/reports"
  format: "html" # html, json

# Settings for 'daemon' mode (Agent)
daemon:
  # [v0.80 NEW] Duty Cycle Configuration for Local Collector
  # The daemon loops: Capture (active) -> Sleep (idle) -> Repeat
  capture_duration: 15 # Time collecting (Engine ON) - Active state
  interval: 15 # Time sleeping (Engine OFF) - Idle state

  # [FUTURE] Remote Server Config (Store-and-Forward)
  server_ip: "10.0.0.1"
  server_port: 443
  auth_token: "CHANGE_ME"

  # [LEGACY v0.60] Direct Sender Options (Not used in v0.80 Local logic yet)
  # batch_size: 10
  # retry_limit: 3

# Settings for 'server' mode (Central Manager)
server:
  # TLS Configuration (Required for Server Mode)
  # ssl_cert: "conf/server_cert.pem"
  ssl_cert: "/etc/sys-inspector/server_cert.pem"
  # ssl_key: "conf/server_key.pem"
  ssl_key: "/etc/sys-inspector/server_key.pem"

  # Access Control
  allowed_agents: [] # List of UUIDs. Empty = Allow All.
