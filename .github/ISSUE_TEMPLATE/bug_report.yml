name: Bug report
description: Something in Sys-Inspector is not working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If this is a **security vulnerability**
        (data tampering, credential exposure, a way to evade detection,
        code execution triggered by an inspected host), please use
        [private vulnerability reporting](../../security) instead of this
        form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact command(s) and, if relevant, the config used.
      placeholder: |
        1. Run `sys-inspector --mode ...`
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sys-Inspector version
      description: Output of `sys-inspector --version`.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options:
        - snapshot
        - daemon
        - server
        - live
        - local-live
        - Not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Distribution and version
      placeholder: e.g. openSUSE Leap 15.6, SLES 15 SP6, Ubuntu 22.04
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: Output of `uname -r`. Only relevant for eBPF-related bugs (daemon/live modes).

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste the relevant lines. This will be rendered as a code block, no need to add fences yourself.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help (config snippet, screenshot, when it started happening).
