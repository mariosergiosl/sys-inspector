name: Feature request
description: Propose a new capability, detection, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or need, before jumping to a specific solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like Sys-Inspector to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why you prefer this one (if any).

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does this mostly belong?
      options:
        - Detection / probe (new signal, ATT&CK technique)
        - Report / UI (HTML report, Manager dashboard)
        - Collection / eBPF
        - Storage / custody / crypto
        - Fleet / server-agent
        - Packaging / distribution
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that helps evaluate this (a scenario it would catch, a false negative it would close, a reference).
