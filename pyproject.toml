# ==============================================================================
# FILE: pyproject.toml
# DESCRIPTION: Build system declaration for sys-inspector.
#              All package metadata (version, entry points, dependencies)
#              is defined in setup.py, which is the single source of truth.
#              Do NOT add a [project] table here; it would conflict with
#              setup.py and break the console_scripts entry point.
# AUTHOR: Mario Luz (Sys-Inspector Project)
# ==============================================================================

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
